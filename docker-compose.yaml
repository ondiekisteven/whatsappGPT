version: '3.8'

services:
  new_whatsapp:
    build:
      context: ./whatsapp_websocket
      dockerfile: Dockerfile
      args:
        - PORT=${PORT}
    restart: always
    env_file: .env
    ports:
      - ${PORT}:${PORT}
    environment:
      - TOKEN=${TOKEN}
      - PORT=${PORT}
      - MONGODB_ENABLED=${MONGODB_ENABLED}
      - MONGODB_URL=${MONGODB_URL}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_BASE64=${WEBHOOK_BASE64}
    #        volumes:
    #            - ./whatsapp_websocket/:/home/node/app
    #            - ./whatsapp_websocket/node_modules/:/home/node/app/node_modules/
    networks:
      - whatsapp-network

  webhooks_api:
    restart: always
    command: gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --error-logfile - --access-logfile -
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./logging.conf:/app/logging.conf
      - ./api/:/app/
    networks:
      - whatsapp-network
    ports:
      - '8006:8000'

  consumer:
    restart: always
    command: python consumer.py
    build:
      context: ./consumers
      dockerfile: Dockerfile
    deploy:
      mode: replicated
      replicas: 3
    env_file:
      - .env
    networks:
      - whatsapp-network


networks:
  whatsapp-network:
    external: true



