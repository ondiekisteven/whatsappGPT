version: "3.7"


services:

  chatgpt:
    build:
      context: .
      dockerfile: Dockerfile

    command: gunicorn app:app --bind 0.0.0.0:5000 --workers 2 --access-logfile /app/logs/chatgpt.log
#    command: flask run --host=0.0.0.0 --port=5000

    ports:
      - "5009:5000"
    restart: always
    env_file:
      - .env
    volumes:
    - ./logs/:/app/logs/
    networks:
      - whatsapp-network

  default_worker:
    build:
        context: .
        dockerfile: Workers.Dockerfile
    command: rq worker default
    env_file:
      - ./.env
    networks:
      - whatsapp-network

  high_worker:
    build:
        context: .
        dockerfile: Workers.Dockerfile
    command: rq worker high
    env_file:
      - ./.env
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    external: true
